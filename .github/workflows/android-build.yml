name: Build RB2 Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: android
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            clang \
            cmake \
            ninja-build \
            openjdk-17-jdk \
            unzip \
            zip \
            wget \
            curl \
            build-essential \
            pkg-config \
            spirv-cross \
            libasound2-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-xinput-dev

      - name: Configure Java
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          set -eux

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

          yes | sdkmanager --licenses || true

      - name: Configure Android SDK path
        run: |
          set -eux

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -e "$HOME/android-sdk" ]; then
            ln -s "$ANDROID_HOME" "$HOME/android-sdk"
          fi

          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          GLSLC="$NDK/shader-tools/linux-x86_64/glslc"

          if [ ! -x "$GLSLC" ]; then
            echo "::error::glslc não encontrado no caminho esperado."
            find "$NDK" -type f -name glslc -print || true
            exit 1
          fi

          "$GLSLC" --version
          echo "Android SDK e NDK configurados."

      - name: Check project scripts
        run: |
          set -eux

          test -f tools/android/prepare_sdk.sh
          test -f tools/android/build_host_cli.sh
          test -f tools/android/codegen.sh
          test -f tools/android/build_native.sh
          test -f tools/android/build_apk.sh

          echo "Todos os scripts foram encontrados."

      - name: Prepare ReXGlue SDK
        run: |
          set -eux
          bash tools/android/prepare_sdk.sh

      - name: Build host recompiler
        run: |
          set -eux
          bash tools/android/build_host_cli.sh

      - name: Build APK
        env:
          RB2_GAME: ${{ vars.RB2_GAME }}
        run: |
          set -eux

          if [ -z "$RB2_GAME" ]; then
            echo "::error::A variável RB2_GAME não foi configurada."
            echo "Configure o acesso aos arquivos próprios do jogo."
            exit 1
          fi

          if [ ! -e "$RB2_GAME" ]; then
            echo "::error::O caminho de RB2_GAME não existe no runner."
            echo "O arquivo ou diretório precisa estar acessível durante a compilação."
            exit 1
          fi

          bash tools/android/codegen.sh "$RB2_GAME"
          bash tools/android/build_native.sh
          bash tools/android/build_apk.sh

      - name: Locate generated APK
        if: success()
        run: |
          set -eux

          find . -type f -name "*.apk" -print

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::O APK não foi encontrado no caminho esperado."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RB2-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
