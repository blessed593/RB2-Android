name: Build RB2 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rb2-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      THPS_SDK: ${{ github.workspace }}/.cache/rexglue-sdk-android
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      JOBS: 4
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: android

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/share/powershell \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/system-images

          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            wget \
            unzip \
            zip \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            ca-certificates \
            libvulkan-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            libxkbcommon-dev \
            wayland-protocols \
            spirv-cross

          command -v spirv-cross
          spirv-cross --help >/dev/null

          pkg-config --modversion x11-xcb
          pkg-config --modversion wayland-client
          pkg-config --modversion wayland-egl
          pkg-config --modversion wayland-cursor
          pkg-config --modversion xkbcommon

      - name: Install Clang 20
        shell: bash
        run: |
          set -eux

          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20

          clang-20 --version
          clang++-20 --version

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.31.6'

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -eux

          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          test -x "$ANDROID_HOME/cmake/3.31.6/bin/cmake"

          java -version
          "$ANDROID_HOME/cmake/3.31.6/bin/cmake" --version
          "$ANDROID_HOME/ndk/28.2.13676358/ndk-build" --version || true

      - name: Install Google Drive API libraries
        shell: bash
        run: |
          set -eux

          python3 -m venv "$RUNNER_TEMP/drive-venv"

          "$RUNNER_TEMP/drive-venv/bin/pip" install \
            google-api-python-client \
            google-auth

      # Xbox 360 ISO cache

      - name: Restore Xbox 360 ISO cache
        id: iso-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/rb2.iso
          key: rb2-iso-v1

      - name: Download private ISO from Google Drive
        if: steps.iso-cache.outputs.cache-hit != 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || {
            echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          }

          test -n "$GOOGLE_DRIVE_FILE_ID" || {
            echo "::error::Missing GOOGLE_DRIVE_FILE_ID secret"
            exit 1
          }

          "$RUNNER_TEMP/drive-venv/bin/python" <<'PY'
          import json
          import os
          import pathlib
          import sys

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GOOGLE_SERVICE_ACCOUNT_JSON"]),
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )

          drive = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          file_id = os.environ["GOOGLE_DRIVE_FILE_ID"]

          metadata = drive.files().get(
              fileId=file_id,
              fields="id,name,size,mimeType",
              supportsAllDrives=True,
          ).execute()

          print("Arquivo:", metadata.get("name", "sem nome"))
          print("Tamanho:", metadata.get("size", "desconhecido"))

          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rb2.iso"

          request = drive.files().get_media(
              fileId=file_id,
              supportsAllDrives=True,
          )

          with output.open("wb") as file:
              downloader = MediaIoBaseDownload(
                  file,
                  request,
                  chunksize=16 * 1024 * 1024,
              )

              done = False

              while not done:
                  status, done = downloader.next_chunk()

                  if status:
                      print(
                          f"Download: {status.progress() * 100:.1f}%",
                          flush=True,
                      )

          actual_size = output.stat().st_size

          if actual_size != 7838695424:
              print(
                  f"Erro: tamanho inesperado da ISO: {actual_size} bytes",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Download concluído: {actual_size} bytes")
          PY

          df -h /

      - name: Verify cached or downloaded ISO
        shell: bash
        run: |
          set -euo pipefail

          ISO="$RUNNER_TEMP/rb2.iso"
          EXPECTED_SIZE=7838695424

          if [ ! -s "$ISO" ]; then
            echo "::error::ISO ausente ou vazia."
            exit 1
          fi

          ACTUAL_SIZE="$(stat -c '%s' "$ISO")"

          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::error::Tamanho inesperado da ISO: $ACTUAL_SIZE bytes."
            exit 1
          fi

          echo "ISO verificada: $ACTUAL_SIZE bytes"
          df -h /

      - name: Save Xbox 360 ISO cache
        if: success() && steps.iso-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/rb2.iso
          key: rb2-iso-v1

      # Prepare ReXGlue SDK without GitHub Actions SDK cache

      - name: Prepare SDK
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/.cache"

          bash tools/android/prepare_sdk.sh "$THPS_SDK"

          test -f "$THPS_SDK/CMakeLists.txt"
          test -f "$THPS_SDK/.android-patches/.applied"
          test -f "$THPS_SDK/src/graphics/vulkan/direct_resolve_shaders.h"

          echo "SDK preparado: $THPS_SDK"

      # Host code generation

      - name: Build host code-generation tool
        shell: bash
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          set -eux

          bash tools/android/build_host_cli.sh "$THPS_SDK"

          test -x "$THPS_SDK/out/linux-amd64/Release/rexglue"

      # Extract and validate game

      - name: Extract Xbox 360 ISO
        shell: bash
        run: |
          set -eux

          GAME_DIR="$RUNNER_TEMP/rb2-game"
          mkdir -p "$GAME_DIR"

          python3 tools/android/xdvdfs.py \
            "$RUNNER_TEMP/rb2.iso" \
            "$GAME_DIR"

          test -s "$GAME_DIR/default.xex"

          echo "Arquivos extraídos:"
          find "$GAME_DIR" -maxdepth 2 -type f | head -80

          ACTUAL_SIZE="$(stat -c '%s' "$GAME_DIR/default.xex")"
          ACTUAL_SHA1="$(sha1sum "$GAME_DIR/default.xex" | cut -d ' ' -f 1)"

          echo "Tamanho do default.xex: $ACTUAL_SIZE bytes"
          echo "SHA-1: $ACTUAL_SHA1"

          if [ "$ACTUAL_SIZE" != "7151616" ]; then
            echo "::error::O default.xex não corresponde ao tamanho esperado da versão USA Rev 1."
            exit 1
          fi

          if [ "$ACTUAL_SHA1" != "f57b501fa2cdd309c2c56b76a5f297acbc564fd2" ]; then
            echo "::error::O SHA-1 do default.xex não corresponde à versão esperada."
            exit 1
          fi

          echo "ISO validada com sucesso."

          rm -f "$RUNNER_TEMP/rb2.iso"
          df -h /

      # Generate game C++ code

      - name: Generate game C++ code
        shell: bash
        run: |
          set -eux

          bash tools/android/codegen.sh "$RUNNER_TEMP/rb2-game" "$THPS_SDK"

      # Build Android native libraries

      - name: Build Android native libraries
        shell: bash
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          set -eux

          bash tools/android/build_native.sh

      # Build APK

      - name: Build release APK
        shell: bash
        run: |
          set -eux

          bash tools/android/build_apk.sh

          APK="android/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          echo "APK criado:"
          ls -lh "$APK"

      # Upload APK artifact

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RB2-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
